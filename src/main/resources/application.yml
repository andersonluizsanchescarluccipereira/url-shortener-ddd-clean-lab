server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: url-shortener-lab
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cassandra:
    contact-points: ${CASSANDRA_HOST:localhost}
    port: ${CASSANDRA_PORT:9042}
    keyspace-name: shortener
    local-datacenter: datacenter1
    request:
      timeout: 4s
    schema-action: none
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  hashids:
    salt: ${HASHIDS_SALT:dev-only-change-this-salt-123456789}
  instance: ${APP_INSTANCE:local}
